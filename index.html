<script>
class Component extends DCLogic {
  hexToRgb(hex) {
    let h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    if (h.length !== 6 || isNaN(n)) return [198, 244, 50];

  }

  componentDidMount() {

  }

  demoVideos() {
    try {
      return { a: document.querySelector('[data-demo="after"]'), b: document.querySelector('[data-demo="before"]') };
    } catch (e) {
      return { a: null, b: null };
    }
  }

  startDemoVideos() {
    const { a, b } = this.demoVideos();
    [a, b].forEach((v) => {
      if (!v) return;
      v.muted = true;
      v.defaultMuted = true;
      v.playsInline = true;
      v.loop = true;
      if (this._reduce) {
        try { v.pause(); v.currentTime = 1.6; } catch (e) {}
      } else {
        const p = v.play();
        if (p && p.catch) p.catch(() => {});
      }
    });
  }

  syncDemoVideos(now) {
    if (this._reduce) return;
    if (this._lastSync && now - this._lastSync < 400) return;
    this._lastSync = now;
    const { a, b } = this.demoVideos();
    if (!a || !b || a.readyState < 2 || b.readyState < 2) return;
    if (a.paused || b.paused) { this.startDemoVideos(); return; }
    const drift = Math.abs(a.currentTime - b.currentTime);
    if (drift > 0.12 && drift < a.duration - 0.3) {

  componentWillUnmount() {

    this.clearChat();
  }

  termText() {
    return 'rayane@cutcode:~$ deploy --video --web --ia';
  }

  tickClock() {
    try {
      const t = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' });
      this.setState({ clock: t });
    } catch (e) {}
  }

  startTyping() {
    const full = this.termText();
    clearInterval(this._type);
    if (this._reduce) {
      this.setState({ typed: full.length });
      return;
    }
    let i = 0;
    this.setState({ typed: 0 });
    this._type = setInterval(() => {
      i += 1;
      this.setState({ typed: i });

  }

  startCaptions() {
    this.stopCaptions();

  stopCaptions() {

    }
  }

  }

  replayChat() {
    this.clearChat();

      this.setState({ chatStep: 4, typing: false });

  sphereInit() {
    const words = ['Next.js', 'React Native', 'Supabase', 'Symfony', 'Python', 'FFmpeg', 'Claude API', 'n8n', 'Make', 'Ansible', 'Stripe', 'WebGPU', 'Whisper', 'Montage', 'Sous-titres', 'Agents IA'];
    const N = 170;
    const pts = [];
    const ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const t = ga * i;
      pts.push({ x: Math.cos(t) * r, y: y, z: Math.sin(t) * r, w: null });
    }
    const step = N / words.length;
    words.forEach((w, k) => {
      pts[Math.min(N - 1, Math.floor(k * step + step / 2))].w = w;
    });
    const pairs = [];
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const dx = pts[i].x - pts[j].x;
        const dy = pts[i].y - pts[j].y;
        const dz = pts[i].z - pts[j].z;

  }

  drawSphere(now) {
    let c = this._canvas;
    if (!c || !c.isConnected) {
      c = document.querySelector('[data-rpm="sphere"]');
      this._canvas = c;
    }
    if (!c) return;
    if (!this._sph) this.sphereInit();
    const s = this._sph;
    const w = c.clientWidth;
    const h = c.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.round(w * dpr);
    const H = Math.round(h * dpr);
    if (c.width !== W || c.height !== H) {
      c.width = W;
      c.height = H;
    }
    const ctx = c.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

      s.rx += s.vx;
      s.ry += s.vy;
      s.vx *= 0.94;
      s.vy *= 0.94;
      if (!this._reduce) s.ry += 0.0028;
      if (now - s.li > 2500) {

    const rgb = this._rgb || [198, 244, 50];
    const col = (al) => 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + Math.max(0, Math.min(1, al)).toFixed(3) + ')';
    const cY = Math.cos(s.ry);
    const sY = Math.sin(s.ry);
    const cX = Math.cos(s.rx);
    const sX = Math.sin(s.rx);
    const R = Math.min(w, h) * 0.34;
    const ox = w / 2;
    const oy = h / 2;
    const fov = 3.2;
    const rot = (x, y, z) => {
      const x1 = x * cY + z * sY;
      const z1 = -x * sY + z * cY;
      const y2 = y * cX - z1 * sX;
      const z2 = y * sX + z1 * cX;
      const k = fov / (fov + z2);
      return { x: ox + x1 * R * k, y: oy + y2 * R * k, z: z2, k: k };
    };

    const P = s.pts.map((p) => {
      const q = rot(p.x, p.y, p.z);
      q.w = p.w;
      return q;
    });

    const tilt = 0.45;
    const ct = Math.cos(tilt);
    const stl = Math.sin(tilt);
    ctx.lineWidth = 1;
    let prev = null;
    for (let i = 0; i <= 96; i++) {
      const a = (i / 96) * Math.PI * 2;
      const x = Math.cos(a) * 1.32;
      const z0 = Math.sin(a) * 1.32;
      const q = rot(x, -z0 * stl, z0 * ct);
      if (prev) {
        const f = 1 - ((prev.z + q.z) / 2 + 1.4) / 2.8;
        ctx.strokeStyle = col(0.06 + f * 0.4);
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(q.x, q.y);
        ctx.stroke();
      }
      prev = q;
    }

    for (let i = 0; i < s.pairs.length; i++) {
      const a = P[s.pairs[i][0]];
      const b = P[s.pairs[i][1]];
      const f = 1 - ((a.z + b.z) / 2 + 1) / 2;
      ctx.strokeStyle = col(0.03 + f * 0.22);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      const f = 1 - (p.z + 1) / 2;
      let r = 0.7 + f * 1.7;
      let al = 0.12 + f * 0.8;
      if (s.mx >= 0) {
        const d = Math.hypot(p.x - s.mx, p.y - s.my);
        if (d < 70) {
          const g = 1 - d / 70;
          r += g * 2.6;
          al += g * 0.5;
        }

      ctx.fillStyle = col(al);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    const sa = (now / 2600) % (Math.PI * 2);
    const sat = rot(Math.cos(sa) * 1.32, -Math.sin(sa) * 1.32 * stl, Math.sin(sa) * 1.32 * ct);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(sat.x, sat.y, 2.6 * sat.k, 0, Math.PI * 2);

    const L = P.filter((p) => p.w).sort((a, b) => b.z - a.z);

    ctx.textBaseline = 'middle';

      const p = L[i];
      const f = 1 - (p.z + 1) / 2;
      const size = Math.round(9 + f * 6);
      ctx.font = '500 ' + size + 'px "JetBrains Mono", ui-monospace, monospace';
      const ly = p.y - 14;
      if (f > 0.72) {
        const tw = ctx.measureText(p.w).width;
        ctx.fillStyle = 'rgba(5,6,10,0.8)';
        ctx.fillRect(p.x - tw / 2 - 7, ly - size / 2 - 4, tw + 14, size + 8);
        ctx.strokeStyle = col(0.55);
        ctx.strokeRect(p.x - tw / 2 - 6.5, ly - size / 2 - 3.5, tw + 13, size + 7);
        ctx.fillStyle = col(1);
      } else {
        ctx.fillStyle = 'rgba(237,238,242,' + (0.1 + f * 0.75).toFixed(3) + ')';
      }
      ctx.fillText(p.w, p.x, ly);
    }
  }

  sphereHandlers() {
    if (this._sh) return this._sh;
    this._sh = {
      ref: (el) => {
        this._canvas = el;

      down: (e) => {
        if (!this._sph) this.sphereInit();
        const s = this._sph;
        s.drag = true;
        s.lx = e.clientX;
        s.ly = e.clientY;
        s.vx = 0;
        s.vy = 0;

      move: (e) => {

        s.my = e.clientY - r.top;

        }
      },

          s.mx = -1;

  }

  objInit() {
    const mk = (bx, by, spin) => ({ x: bx, y: by, bx: bx, by: by, vx: 0, vy: 0, drag: false, lx: 0, ly: 0, li: 0, spin: spin });
    this._objs = {
      phone: mk(-8, -24, 0.22),

  stepObjects(now) {
    if (!this._objs) return;
    const norm = (v) => ((((v + 180) % 360) + 360) % 360) - 180;
    const keys = Object.keys(this._objs);
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      const o = this._objs[k];
      if (!o.drag) {
        o.x += o.vx;
        o.y += o.vy;
        o.vx *= 0.92;
        o.vy *= 0.92;
        if (now - o.li > 2200) {
          o.x = norm(o.x);
          o.x += (o.bx - o.x) * 0.03;
          if (o.spin) {
            if (!this._reduce) o.y += o.spin;
            if (Math.abs(o.y) > 3600) o.y = norm(o.y);
          } else {
            o.y = norm(o.y);
            const ty = o.by + (this._reduce ? 0 : Math.sin(now / 1500) * 14);
            o.y += (ty - o.y) * 0.03;
          }
        }
      }
      let el = this._els[k];
      if (!el || !el.isConnected) {
        el = document.querySelector('[data-rpm-obj="' + k + '"]');
        this._els[k] = el;
      }
      if (el) el.style.transform = 'rotateX(' + o.x.toFixed(2) + 'deg) rotateY(' + o.y.toFixed(2) + 'deg)';

  objHandlers(k) {
    if (!this._objs) this.objInit();
    this._h = this._h || {};
    if (this._h[k]) return this._h[k];
    const get = () => this._objs && this._objs[k];
    const skip = (e) => e.target && e.target.closest && e.target.closest('button, a, input, textarea');

        o.ly = e.clientY;

        const o = get();

  }

    }));
    const macro = { p: gd.p + '%', g: gd.g + '%', l: gd.l + '%', deg: gd.deg, label: gd.label };

    const n = st.crates ?? 4;

    const orange = (al) => 'rgba(255,138,61,' + al + ')';
    const cr = {
      face: low ? orange(0.1) : a(0.07),
      line: low ? orange(0.9) : a(0.8),
      inner: low ? orange(0.12) : a(0.1)
    };
    const stock = {
      label: n + (n > 1 ? ' CAISSES' : ' CAISSE'),
      status: n === 0 ? 'RUPTURE' : low ? 'SEUIL BAS' : 'OK',
      badgeBg: low ? '#3A2516' : '#1A1D25',
      badgeFg: low ? '#FFB27A' : '#D4D6DC',
      low: low,
      ok: !low,
      log: moves === 0 ? 'Stock calculé depuis l\'historique des mouvements' : moves + (moves > 1 ? ' mouvements' : ' mouvement') + ' · stock recalculé',
      take: () => {
        const s = this.state || {};
        this.setState({ crates: Math.max(0, (s.crates ?? 4) - 1), moves: (s.moves ?? 0) + 1 });
      },
      add: () => {
        const s = this.state || {};
        this.setState({ crates: Math.min(6, (s.crates ?? 4) + 1), moves: (s.moves ?? 0) + 1 });
      }
    };

    const step = st.chatStep ?? 4;
    const typing = !!st.typing;
    const slot = (on, typ) => ({ bo: on ? 1 : 0, by: on ? 0 : 10, to: typ ? 1 : 0 });
    const chat = {
      s1: slot(step >= 1, typing && step === 0),
      s2: slot(step >= 2, typing && step === 1),
      s3: slot(step >= 3, typing && step === 2),
      s4: slot(step >= 4, false),
      replay: () => this.replayChat()
    };

    const needDefs = [
      { id: 'video', label: 'Montage vidéo' },
      { id: 'site', label: 'Site web' },
      { id: 'app', label: 'Logiciel ou app' },
      { id: 'auto', label: 'Automatisation et IA' }
    ];
    const delayDefs = [
      { id: 'urgent', label: 'Urgent' },
      { id: 'twoweeks', label: 'Sous 2 semaines' },
      { id: 'flex', label: 'Pas pressé' }
    ];
    const budgetDefs = [
      { id: 'b1', label: 'Moins de 500 €' },
      { id: 'b2', label: '500 à 1 000 €' },
      { id: 'b3', label: 'Plus de 1 000 €' },
      { id: 'b4', label: 'À définir' }
    ];
    const need = st.need ?? 'video';
    const delay = st.delay ?? 'twoweeks';
    const budget = st.budget ?? 'b4';
    const note = st.note ?? '';
    const mk = (defs, cur, key) => defs.map((d) => Object.assign({}, chip(d.id === cur), {
      label: d.label,
      pick: () => this.setState({ [key]: d.id })
    }));
    const labelOf = (defs, id) => (defs.find((d) => d.id === id) || defs[0]).label;
    const needLabel = labelOf(needDefs, need);
    const delayLabel = labelOf(delayDefs, delay);
    const budgetLabel = labelOf(budgetDefs, budget);
    const summary = needLabel + ' · ' + delayLabel + ' · ' + budgetLabel;
    const body = 'Bonjour Rayane,\n\nBesoin : ' + needLabel + '\nDélai : ' + delayLabel + '\nBudget : ' + budgetLabel + (note ? '\n\nLe projet : ' + note : '') + '\n\nMerci !';
    const mailto = 'mailto:' + email + '?subject=' + encodeURIComponent('Demande de projet : ' + needLabel) + '&body=' + encodeURIComponent(body);
    const subj = 'Demande de projet : ' + needLabel;
    const q = (k1, k2, k3) => k1 + '=' + encodeURIComponent(email) + '&' + k2 + '=' + encodeURIComponent(subj) + '&' + k3 + '=' + encodeURIComponent(body);
    let mobile = false;
    try { mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); } catch (e) {}
    const mail = mobile
      ? { gmail: 'googlegmail://co?' + q('to', 'subject', 'body'), outlook: 'ms-outlook://compose?' + q('to', 'subject', 'body'), defaultLabel: 'App Mail', target: '_self' }
      : { gmail: 'https://mail.google.com/mail/?view=cm&fs=1&' + q('to', 'su', 'body'), outlook: 'https://outlook.live.com/mail/0/deeplink/compose?' + q('to', 'subject', 'body'), defaultLabel: 'Logiciel de mail', target: '_blank' };

    const tiltMove = (e) => {
      if (this._reduce) return;
      const el = e.currentTarget;
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = 'perspective(900px) rotateX(' + (-py * 9).toFixed(2) + 'deg) rotateY(' + (px * 11).toFixed(2) + 'deg)';
    };
    const tiltLeave = (e) => {
      e.currentTarget.style.transform = '';
    };

    return {
      accent: accent,
      acc: acc,
      email: email,
      clock: st.clock ?? '--:--',
      typedText: typedText,
      sph: this.sphereHandlers(),
      h3d: {
        phone: this.objHandlers('phone'),
        layers: this.objHandlers('layers'),
        crates: this.objHandlers('crates'),
        tracks: this.objHandlers('tracks'),
        bars: this.objHandlers('bars'),
        chat: this.objHandlers('chat')
      },
      tiltMove: tiltMove,
      tiltLeave: tiltLeave,
      filters: filters,
      show: show,
      words: words,
      progress: progress,
      playing: playing,
      paused: !playing,
      playLabel: playing ? 'Mettre en pause les sous-titres' : 'Lancer les sous-titres',
      togglePlay: togglePlay,
      split: split,
      clipRight: 100 - split,
      onSplit: onSplit,
      dragStart: dragStart,
      dragMove: dragMove,
      dragEnd: dragEnd,
      goals: goals,
      macro: macro,
      crates: crates,
      cr: cr,
      stock: stock,
      chat: chat,
      needs: mk(needDefs, need, 'need'),
      delays: mk(delayDefs, delay, 'delay'),
      budgets: mk(budgetDefs, budget, 'budget'),
      note: note,
      onNote: (e) => this.setState({ note: e.target.value }),
      summary: summary,
      mailto: mailto,
      mail: mail,
      mailOpen: !!st.mailOpen,
      toggleMail: () => this.setState({ mailOpen: !(this.state || {}).mailOpen }),
      pickNeed: {
        video: () => this.setState({ need: 'video' }),
        site: () => this.setState({ need: 'site' }),
        auto: () => this.setState({ need: 'auto' })
      }
    };
  }
}
